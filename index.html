<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dead girls club</title>
  <style>
    /* Raw early 2000s layout styling with background video support */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
      overflow: hidden;
    }

    /* Fullscreen looping background video pulling from images folder */
    #bgVideo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    /* Centered stack for navigation links layered above video */
    .center-container {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-height: 100vh;
      text-align: center;
      z-index: 2;
    }

    /* Standard classic blue link appearance with a subtle background contrast */
    a.site-link {
      color: #0000ee;
      font-size: 16px;
      text-decoration: underline;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.75);
      padding: 2px 6px;
    }

    a.site-link:visited {
      color: #0000ee;
    }

    a.site-link:active {
      color: #ff0000;
    }
  </style>
</head>
<body>

  <!-- Fullscreen Looping Background Video with native audio enabled -->
  <video id="bgVideo" src="images/loop.mp4" autoplay loop playsinline></video>

  <!-- Centered links floating in the middle of the screen -->
  <div class="center-container">
    <a href="confessions.html" class="site-link">confessions</a>
    <a href="https://hollywoodsigns.org" class="site-link">join club</a>
  </div>

  <script>
    const video = document.getElementById('bgVideo');

    // Attempt instant unmuted playback on load; if browser policy blocks it,
    // fallback to playing muted immediately so the loop runs, then unmute on the first click anywhere.
    window.addEventListener('DOMContentLoaded', () => {
      video.muted = false;
      video.play().catch(() => {
        video.muted = true;
        video.play();
        
        const unlockAudio = () => {
          video.muted = false;
          window.removeEventListener('click', unlockAudio);
          window.removeEventListener('keydown', unlockAudio);
        };
        window.addEventListener('click', unlockAudio);
        window.addEventListener('keydown', unlockAudio);
      });
    });
  </script>

</body>
</html>
