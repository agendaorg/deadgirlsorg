<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Untitled Document</title>
  <style>
    /* Raw early 2000s layout styling */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
    }

    /* Top left raw placeholder text */
    .top-left-text {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 14px;
      user-select: none;
    }

    /* Centered low-effort floating link */
    .center-container {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      text-align: center;
    }

    /* Standard default browser link appearance */
    a.confession-link {
      color: #0000ee;
      font-size: 16px;
      text-decoration: underline;
      cursor: pointer;
    }

    a.confession-link:visited {
      color: #551a8b;
    }

    a.confession-link:active {
      color: #ff0000;
    }
  </style>
</head>
<body>

  <!-- Eerie top-left placeholder text -->
  <div class="top-left-text"></div>

  <!-- Centered link floating in the middle of the screen -->
  <div class="center-container">
    <a href="confessions.html" class="confession-link">confessions</a>
  </div>

</body>
</html>
