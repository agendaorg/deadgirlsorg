<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>confessions</title>
  <style>
    /* Raw 2003 web default aesthetic */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
    }

    /* 2003 AOL-Style Solid White Intro Overlay */
    #introOverlay {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #eyeCanvas {
      display: block;
      image-rendering: pixelated;
    }

    .header-nav {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 14px;
    }

    a {
      color: #0000ee;
      text-decoration: underline;
    }

    a:visited {
      color: #551a8b;
    }

    a:active {
      color: #ff0000;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .confession-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }

    .instructions {
      font-size: 14px;
      margin-bottom: 12px;
      color: #333333;
      text-align: center;
    }

    .text-input {
      width: 100%;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      padding: 6px;
      margin-bottom: 8px;
      border: 1px solid #7f9db9;
      box-sizing: border-box;
      outline: none;
      background-color: #ffffff;
    }

    textarea {
      width: 100%;
      height: 180px;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      padding: 6px;
      border: 1px solid #7f9db9;
      box-sizing: border-box;
      resize: vertical;
      outline: none;
      background-color: #ffffff;
    }

    .submit-btn {
      margin-top: 14px;
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      padding: 2px 12px;
      background-color: #efefef;
      border: 2px outset #ffffff;
      cursor: pointer;
    }

    .submit-btn:active {
      border-style: inset;
    }

    /* Inline Font-Shuffle Display Area under submit button */
    #shuffleContainer {
      display: none;
      margin-top: 14px;
      text-align: center;
      height: 24px;
    }

    #shuffleText {
      font-size: 13px;
      letter-spacing: 1px;
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- 4-Second 2003 AOL-Style Eye Intro Overlay -->
  <div id="introOverlay">
    <canvas id="eyeCanvas" width="140" height="70"></canvas>
  </div>

  <div class="header-nav">
    <a href="index.html">&lt; back</a> 
  </div>

  <div class="main-container">
    <form class="confession-form" id="voidForm" action="https://api.web3forms.com/submit" method="POST" onsubmit="handleVoidSubmit(event)">
      
      <input type="hidden" name="access_key" value="72247000-1724-4fa1-a0a8-5a91c8e35a93">
      <input type="hidden" name="subject" value="New Confession Received">
      
      <div class="instructions">Do you think your favorite celebrity is actually happy</div>
      <input type="text" id="nameInput" name="name" class="text-input" placeholder="name">
      <input type="email" id="emailInput" name="email" class="text-input" required placeholder="email">
      <textarea id="confessionInput" name="confession" required placeholder="type here..."></textarea>
      <input type="submit" value="submit" class="submit-btn" />
      
      <!-- Inline font-shuffle animation slot right beneath the submit button -->
      <div id="shuffleContainer">
        <div id="shuffleText">deadgirls</div>
      </div>
    </form>
  </div>

  <script>
    // 2003 AOL Graphic Style Retro Eye Intro
    const eCanvas = document.getElementById('eyeCanvas');
    const eCtx = eCanvas.getContext('2d');
    let frame = 0;

    function drawRetroEye() {
      eCtx.fillStyle = '#ffffff';
      eCtx.fillRect(0, 0, eCanvas.width, eCanvas.height);

      const cx = eCanvas.width / 2;
      const cy = eCanvas.height / 2;
      
      frame++;

      eCtx.strokeStyle = '#000000';
      eCtx.lineWidth = 2;
      eCtx.fillStyle = '#ffffff';
      
      eCtx.beginPath();
      eCtx.moveTo(cx - 50, cy);
      eCtx.quadraticCurveTo(cx, cy - 28, cx + 50, cy);
      eCtx.quadraticCurveTo(cx, cy + 28, cx - 50, cy);
      eCtx.closePath();
      eCtx.fill();
      eCtx.stroke();

      const isBlinking =
        (frame > 25 && frame < 45) ||
        (frame > 85 && frame < 105);

      if (isBlinking) {
        eCtx.beginPath();
        eCtx.moveTo(cx - 35, cy);
        eCtx.lineTo(cx + 35, cy);
        eCtx.stroke();
      } else {
        eCtx.fillStyle = '#000000';
        eCtx.beginPath();
        eCtx.arc(cx, cy, 7, 0, Math.PI * 2);
        eCtx.fill();

        eCtx.fillStyle = '#ffffff';
        eCtx.fillRect(cx + 2, cy - 4, 2, 2);
      }

      if (frame < 160) {
        requestAnimationFrame(drawRetroEye);
      }
    }

    drawRetroEye();

    // Exactly 4 seconds intro cut
    setTimeout(() => {
      const overlay = document.getElementById('introOverlay');
      overlay.style.display = 'none';
    }, 4000);

    // Submission Font-Shuffle Handler (under the button)
    async function handleVoidSubmit(event) {
      event.preventDefault();
      
      const form = event.target;
      const submitBtn = form.querySelector('.submit-btn');
      const shuffleContainer = document.getElementById('shuffleContainer');
      const shuffleText = document.getElementById('shuffleText');
      
      // Disable and hide submit button, reveal shuffle slot underneath
      submitBtn.style.display = 'none';
      shuffleContainer.style.display = 'block';

      try {
        const formData = new FormData(form);
        await fetch(form.action, {
          method: 'POST',
          body: formData
        });
      } catch (e) {}

      const fonts = [
        'Impact, sans-serif',
        '"Courier New", Courier, monospace',
        '"Comic Sans MS", cursive, sans-serif',
        'Georgia, serif',
        'Verdana, sans-serif',
        '"Times New Roman", Times, serif',
        'Arial, sans-serif'
      ];

      const textStyles = ['deadgirls', 'DEADGIRLS', 'dead_girls', 'd e a d g i r l s', 'DEAD GIRLS'];

      let shuffleElapsed = 0;
      const shuffleInterval = setInterval(() => {
        shuffleElapsed += 120;
        
        const randomFont = fonts[Math.floor(Math.random() * fonts.length)];
        const randomText = textStyles[Math.floor(Math.random() * textStyles.length)];
        const randomSize = 11 + Math.floor(Math.random() * 5) + 'px';

        shuffleText.style.fontFamily = randomFont;
        shuffleText.style.fontSize = randomSize;
        shuffleText.textContent = randomText;

        if (shuffleElapsed >= 4500) {
          clearInterval(shuffleInterval);
          window.location.href = 'index.html';
        }
      }, 120);
    }
  </script>

</body>
</html>
