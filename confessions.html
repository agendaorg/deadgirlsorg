<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>confessions</title>
  <style>
    /* Raw 2003 web default aesthetic */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100vh;
      background-color: #ffffff;
      color: #000000;
      font-family: "Times New Roman", Times, serif;
    }

    /* Fullscreen Clean Intro Overlay (8-Second Sequence with Sharp Line Blink) */
    #introEyeScreen {
      position: fixed;
      inset: 0;
      background-color: #ffffff;
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: opacity 0.6s ease;
    }

    .eye-wrapper {
      width: 80px;
      height: 40px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #eyeSvg {
      width: 64px;
      height: 36px;
      display: block;
    }

    #pupilGroup {
      transition: transform 0.8s ease-in-out;
    }

    /* Main Form Page (Hidden until 8s intro sequence finishes) */
    #mainPageContent {
      display: none;
    }

    .header-nav {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 14px;
    }

    a {
      color: #0000ee;
      text-decoration: underline;
    }

    a:visited {
      color: #551a8b;
    }

    a:active {
      color: #ff0000;
    }

    .main-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    .confession-form {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 500px;
    }

    .instructions {
      font-size: 14px;
      margin-bottom: 12px;
      color: #333333;
      text-align: center;
    }

    .text-input {
      width: 100%;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      padding: 6px;
      margin-bottom: 8px;
      border: 1px solid #7f9db9;
      box-sizing: border-box;
      outline: none;
      background-color: #ffffff;
    }

    textarea {
      width: 100%;
      height: 180px;
      font-family: "Times New Roman", Times, serif;
      font-size: 14px;
      padding: 6px;
      border: 1px solid #7f9db9;
      box-sizing: border-box;
      resize: vertical;
      outline: none;
      background-color: #ffffff;
    }

    .submit-btn {
      margin-top: 14px;
      font-family: "Times New Roman", Times, serif;
      font-size: 13px;
      padding: 2px 12px;
      background-color: #efefef;
      border: 2px outset #ffffff;
      cursor: pointer;
    }

    .submit-btn:active {
      border-style: inset;
    }

    /* Looped small "dead girls" font-cycling status under submit button */
    #statusNotice {
      display: none;
      font-size: 11px;
      letter-spacing: 0.5px;
      text-transform: lowercase;
      color: #000000;
      margin-top: 14px;
      text-align: center;
      min-height: 16px;
    }
  </style>
</head>
<body>

  <!-- Standalone Intro Screen: 8-Second Sequence with Literal Line Blink -->
  <div id="introEyeScreen">
    <div class="eye-wrapper">
      <svg id="eyeSvg" viewBox="0 0 60 32" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 16 Q30 -8 58 16 Q30 40 2 16 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
        <g id="pupilGroup">
          <circle cx="30" cy="16" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
          <circle cx="30" cy="16" r="3.5" fill="#000000"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Main Confession Form View -->
  <div id="mainPageContent">
    <div class="header-nav">
      <a href="index.html">&lt; back</a> 
    </div>

    <div class="main-container">
      <form class="confession-form" id="voidForm" action="https://api.web3forms.com/submit" method="POST" onsubmit="handleVoidSubmit(event)">
        
        <input type="hidden" name="access_key" value="72247000-1724-4fa1-a0a8-5a91c8e35a93">
        <input type="hidden" name="subject" value="New Confession Received">
        
        <div class="instructions">What are you afraid of</div>
        <input type="text" id="nameInput" name="name" class="text-input" placeholder="name">
        <input type="email" id="emailInput" name="email" class="text-input" required placeholder="email">
        <textarea id="confessionInput" name="confession" required placeholder="type here..."></textarea>
        <input type="submit" value="submit" class="submit-btn" />
        <div id="statusNotice">dead girls</div>
      </form>
    </div>
  </div>

  <script>
    const eyeSvg = document.getElementById('eyeSvg');
    const introScreen = document.getElementById('introEyeScreen');

    // Current offset tracking for looking around while keeping the pupil inside the open eye state
    let currentOffsetX = 0;
    let currentOffsetY = 0;

    function renderEye(isOpen, offsetX = 0, offsetY = 0) {
      currentOffsetX = offsetX;
      currentOffsetY = offsetY;

      if (!isOpen) {
        // Literal closed horizontal dash line '-'
        eyeSvg.innerHTML = `
          <line x1="8" y1="16" x2="52" y2="16" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
        `;
      } else {
        // Fully open eye with pupil shifted to current gaze coordinates
        eyeSvg.innerHTML = `
          <path d="M2 16 Q30 -8 58 16 Q30 40 2 16 Z" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
          <g transform="translate(${offsetX}, ${offsetY})">
            <circle cx="30" cy="16" r="8" fill="#ffffff" stroke="#000000" stroke-width="1.5"/>
            <circle cx="30" cy="16" r="3.5" fill="#000000"/>
          </g>
        `;
      }
    }

    function executeSharpBlink() {
      renderEye(false); // Snap to literal closed line '-'
      setTimeout(() => {
        renderEye(true, currentOffsetX, currentOffsetY); // Snap back open
      }, 160);
    }

    // Choreographed 8-second timeline with distinct blinking and looking around
    renderEye(true, 0, 0);

    setTimeout(executeSharpBlink, 800);                    // 1st blink

    setTimeout(() => {
      renderEye(true, -5, 1);                              // Look left
    }, 1800);

    setTimeout(() => {
      renderEye(true, 6, -1);                              // Look right
    }, 3600);

    setTimeout(executeSharpBlink, 5000);                    // 2nd blink (mid-sequence)

    setTimeout(() => {
      renderEye(true, 0, 2);                              // Look down
    }, 6200);

    setTimeout(() => {
      renderEye(true, 0, 0);                              // Center back
    }, 7200);

    // Fade out intro overlay at 8 seconds and reveal the confession form
    setTimeout(() => {
      introScreen.style.opacity = '0';
      setTimeout(() => {
        introScreen.style.display = 'none';
        document.getElementById('mainPageContent').style.display = 'block';
      }, 600);
    }, 8000);

    // 2. Submission Handler with Looped Small "dead girls" Font Cycling
    async function handleVoidSubmit(event) {
      event.preventDefault();
      
      const form = event.target;
      const nameInput = document.getElementById('nameInput');
      const emailInput = document.getElementById('emailInput');
      const textarea = document.getElementById('confessionInput');
      const notice = document.getElementById('statusNotice');
      const submitBtn = document.querySelector('.submit-btn');
      
      // Show looped "dead girls" font animation & disable button
      notice.style.display = 'block';
      submitBtn.disabled = true;

      const fontPool = [
        '"Times New Roman", Times, serif',
        'Courier New, Courier, monospace',
        'Arial, Helvetica, sans-serif',
        'Georgia, serif',
        'Impact, sans-serif',
        'Verdana, Geneva, sans-serif',
        'Trebuchet MS, sans-serif'
      ];

      const fontLoop = setInterval(() => {
        notice.style.fontFamily = fontPool[Math.floor(Math.random() * fontPool.length)];
        notice.style.fontWeight = Math.random() > 0.5 ? 'bold' : 'normal';
        notice.style.fontStyle = Math.random() > 0.7 ? 'italic' : 'normal';
      }, 130);

      try {
        // Transmit name, email, and confession to deadgirlsclub@aol.com via Web3Forms
        const formData = new FormData(form);
        await fetch(form.action, {
          method: 'POST',
          body: formData
        });
      } catch (e) {
        // Fail silently to keep the eerie feel if network hiccups
      }

      // Clear inputs, stop loop, and redirect back to index.html
      setTimeout(function() {
        clearInterval(fontLoop);
        nameInput.value = '';
        emailInput.value = '';
        textarea.value = '';
        window.location.href = 'index.html';
      }, 1800);
    }
  </script>

</body>
</html>
